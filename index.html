<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Party Games</title>
  <style>
    /* Theme lives in these variables — swap them to re-skin the page. */
    :root {
      --bg: #1b1b2f;
      --card: #272744;
      --text: #f4f4f8;
      --muted: #a9a9c2;
      --accent: #ff6b9d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 16px;
    }
    h1 { font-size: 2.5rem; margin: 0 0 8px; text-align: center; }
    p.sub { color: var(--muted); margin: 0 0 40px; text-align: center; }
    .games {
      display: grid;
      gap: 20px;
      width: 100%;
      max-width: 720px;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    }
    .game {
      display: block;
      background: var(--card);
      border-radius: 16px;
      padding: 28px 24px;
      color: inherit;
      text-decoration: none;
      border: 2px solid transparent;
      transition: transform .15s, border-color .15s;
    }
    .game:hover, .game:focus-visible { transform: translateY(-4px); border-color: var(--accent); }
    .game h2 { margin: 0 0 8px; color: var(--accent); }
    .game p { margin: 0; color: var(--muted); }
  </style>
</head>
<body>
  <h1>Party Games</h1>
  <p class="sub">Pick a game and play with friends.</p>
  <main class="games">
    <a class="game" href="https://multiplayer-eric.onrender.com/">
      <h2>Multiplayer Eric</h2>
      <p>Play now →</p>
    </a>
    <a class="game" href="https://matchy-finderoo.onrender.com/">
      <h2>Matchy Finderoo</h2>
      <p>Play now →</p>
    </a>
  </main>
</body>
</html>
