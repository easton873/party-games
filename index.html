<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Party Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Patua+One&display=swap" rel="stylesheet">
  <style>
    :root {
      --felt: #1f5c43;
      --felt-dark: #143d2d;
      --wood: #6b4226;
      --wood-dark: #4a2c17;
      --cream: #fbf3df;
      --ink: #3a2a1a;
      --red: #d9453d;
      --gold: #f2b632;
      --blue: #2f6fb5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Fredoka", system-ui, sans-serif;
      color: var(--cream);
      /* felt table with a subtle weave and vignette */
      background:
        radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.45) 100%),
        repeating-linear-gradient(45deg, rgba(255,255,255,.025) 0 2px, transparent 2px 4px),
        repeating-linear-gradient(-45deg, rgba(0,0,0,.05) 0 2px, transparent 2px 4px),
        var(--felt);
      /* wood table edge */
      border: 18px solid var(--wood);
      border-image: repeating-linear-gradient(90deg, var(--wood) 0 40px, var(--wood-dark) 40px 44px) 18;
      padding: 40px 16px 56px;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    header { text-align: center; margin-bottom: 48px; }
    h1 {
      font-family: "Patua One", serif;
      font-size: clamp(2.6rem, 9vw, 4.5rem);
      margin: 0;
      color: var(--gold);
      letter-spacing: 2px;
      text-shadow: 0 3px 0 var(--wood-dark), 0 6px 12px rgba(0,0,0,.4);
    }

    .games {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 40px;
      width: 100%;
      max-width: 1100px;
    }

    /* Each game is a card dealt onto the table */
    .game {
      position: relative;
      width: 300px;
      min-height: 380px;
      padding: 28px 24px;
      background: var(--cream);
      color: var(--ink);
      border-radius: 18px;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 48px;
      text-align: center;
      box-shadow: 0 10px 0 rgba(0,0,0,.25), 0 18px 30px rgba(0,0,0,.4);
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .game:nth-child(odd)  { transform: rotate(-3deg); }
    .game:nth-child(even) { transform: rotate(2.5deg); }
    .game:hover, .game:focus-visible {
      transform: rotate(0deg) translateY(-10px) scale(1.04);
      box-shadow: 0 18px 0 rgba(0,0,0,.2), 0 30px 40px rgba(0,0,0,.45);
      outline: none;
    }
    .game::before {           /* inner border like a playing card */
      content: "";
      position: absolute;
      inset: 10px;
      border: 3px solid var(--card-color);
      border-radius: 12px;
      pointer-events: none;
    }
    .game.eric  { --card-color: var(--red); }
    .game.matchy { --card-color: var(--blue); }
    .game.name { --card-color: #c98a0a; }
    .game.soon { cursor: default; }
    .game.soon .play { opacity: .6; }
    .game.soon:hover { transform: rotate(-3deg); box-shadow: 0 10px 0 rgba(0,0,0,.25), 0 18px 30px rgba(0,0,0,.4); }

    .corner {
      position: absolute;
      font-family: "Patua One", serif;
      font-size: 1.6rem;
      line-height: 1;
      color: var(--card-color);
    }
    .corner.tl { top: 22px; left: 24px; }
    .corner.br { bottom: 22px; right: 24px; transform: rotate(180deg); }

    .game h2 {
      font-family: "Patua One", serif;
      font-size: 2rem;
      margin: 0;
      line-height: 1.1;
      color: var(--card-color);
    }
    .play {
      margin-bottom: 14px;
      padding: 10px 28px;
      border-radius: 999px;
      background: var(--card-color);
      color: var(--cream);
      font-weight: 700;
      font-size: 1.1rem;
      box-shadow: 0 4px 0 rgba(0,0,0,.25);
    }


    @media (max-width: 480px) {
      body { border-width: 10px; padding-top: 28px; }
      .games { gap: 32px; }

    }
    @media (prefers-reduced-motion: reduce) {
      .game { transition: none; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Party Games</h1>
  </header>

  <main class="games">
    <a class="game eric" href="https://multiplayer-eric.onrender.com/">
      <span class="corner tl">♥</span>
      <h2>Multiplayer Eric</h2>
      <span class="play">Play</span>
      <span class="corner br">♥</span>
    </a>
    <a class="game matchy" href="https://matchy-finderoo.onrender.com/">
      <span class="corner tl">♣</span>
      <h2>Matchy Finderoo</h2>
      <span class="play">Play</span>
      <span class="corner br">♣</span>
    </a>
    <div class="game name soon">
      <span class="corner tl">♦</span>
      <h2>The Name Game</h2>
      <span class="play">Coming soon</span>
      <span class="corner br">♦</span>
    </div>
  </main>
</body>
</html>
